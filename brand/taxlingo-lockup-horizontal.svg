<?xml version="1.0" encoding="UTF-8"?>
<!--
  TaxLingo — lockup horizontal (ícone + wordmark lado a lado)
  Conceito: Ledger T. Cores naturais (mark verde, ponto dourado) — pensado
  para fundo claro/branco. Base da linha alinhada entre ícone e texto.
  Fonte do wordmark: Manrope ExtraBold (800), tracking -1%. Carregue a
  fonte (Google Fonts) no documento de destino; texto já vem convertido
  como <text>, não como path, para ficar editável — converta para path
  na hora de exportar se o ambiente de destino não tiver a fonte instalada.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 120" width="580" height="120">
  <defs>
    <symbol id="mark" viewBox="0 0 172 160">
      <rect x="0" y="0" width="120" height="44" rx="4" fill="#1E8F5E"/>
      <rect x="38" y="30" width="44" height="130" rx="4" fill="#1E8F5E"/>
      <circle cx="144" cy="94" r="28" fill="#C98A2C"/>
    </symbol>
    <style>
      .wordmark { font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif; font-weight: 800; font-size: 76px; letter-spacing: -0.76px; }
    </style>
  </defs>
  <use href="#mark" x="24" y="18" width="75.25" height="70"/>
  <text x="128" y="88" class="wordmark">
    <tspan fill="#1E8F5E">TaxLingo</tspan><tspan fill="#C98A2C">.</tspan>
  </text>
</svg>
